name: Issue Priority Labeler

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-priority-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const section = (issue.body || '').match(/^### 우선순위\s*\n([\s\S]*?)(?=^### |$(?![\s\S]))/m);
            if (!section) return;
            const match = section[1].trim().match(/^priority: (low|medium|high|critical)(?:\s+-[^\n]*)?$/);
            const selected = match ? `priority: ${match[1]}` : null;
            const colors = { low: 'c2e0c6', medium: 'fbca04', high: 'ff9f1c', critical: 'd73a4a' };
            if (selected) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: selected });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({ owner, repo, name: selected, color: colors[match[1]], description: '이슈 우선순위' });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                  await github.rest.issues.getLabel({ owner, repo, name: selected });
                }
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [selected] });
            }
            const priorities = Object.keys(colors).map(value => `priority: ${value}`);
            for (const label of issue.labels) {
              if (priorities.includes(label.name) && label.name !== selected) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label.name });
              }
            }
